[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-rl-platform"
version = "0.1.0"
description = "A modular JAX reinforcement-learning platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jax[cpu]>=0.4.30",
  "optax>=0.2.3",
  "gymnasium>=0.29.1",
  "flax>=0.8.5",
  "numpy>=1.26",
  "pandas>=2.0",
  "plotly>=5.0",
  "streamlit>=1.30",
  "protobuf>=3.20,<7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -p no:cacheprovider"
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 3

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
