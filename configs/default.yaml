schema_version: 1

environment:
  name: CartPole-v1

algorithm:
  name: dqn
  hyperparameters:
    learning_rate: 0.001
    gamma: 0.99
    batch_size: 64
    replay_capacity: 10000
    min_replay_size: 1000
    target_update_interval: 100
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_steps: 10000
    hidden_layers: 2
    hidden_size: 64
    activation: relu
    optimizer: adam

run:
  seed: 0
  episodes: 200
  max_steps_per_episode: 500
  evaluation_episodes: 10
  moving_average_window: 100

paths:
  experiments: experiments
  checkpoints: checkpoints
  results: results

logging:
  level: INFO
